[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartchunk"
version = "0.1.0"
description = "Self-describing document chunks with summaries, entities & context for production RAG."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SmartChunk Contributors"},
]
keywords = ["rag", "chunking", "llm", "retrieval", "vector-database", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
]

dependencies = [
    "pydantic>=2.0",
    "litellm>=1.40",
    "tiktoken>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pdf = ["pymupdf4llm>=0.0.10"]
docx = ["python-docx>=1.0"]
html = ["beautifulsoup4>=4.12", "lxml>=5.0"]
semantic = ["sentence-transformers>=3.0", "numpy>=1.26"]
retrieval = ["rank-bm25>=0.2"]
reranker = ["sentence-transformers>=3.0"]
pinecone = ["pinecone-client>=3.0"]
chromadb = ["chromadb>=0.5"]
xlsx = ["openpyxl>=3.1"]
pptx = ["python-pptx>=1.0"]
all = ["smartchunk[pdf,docx,html,semantic,retrieval,reranker,pinecone,chromadb,xlsx,pptx]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/smartchunk/smartchunk"
Repository = "https://github.com/smartchunk/smartchunk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
